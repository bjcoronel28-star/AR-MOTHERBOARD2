<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets (2).mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- Optional: replace the primitive box below with a 3D GLTF/GLB model -->
        <!-- <a-asset-item id="model" src="./model.glb"></a-asset-item> -->
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-box
          position="0 0 0.25"
          scale="0.5 0.5 0.5"
          color="#4CC3D9"
          opacity="0.9"
        ></a-box>
        <!-- <a-gltf-model src="#model" position="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model> -->
      </a-entity>
    </a-scene>
  </body>
</html>
