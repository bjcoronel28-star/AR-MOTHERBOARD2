<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D Motherboard MindAR Interactive Viewer</title>
  <style>
    :root {
      --bg-panel: rgba(14, 19, 32, 0.86);
      --border-panel: rgba(255, 255, 255, 0.16);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      user-select: none;
      touch-action: none;
    }

    #ar-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #ar-container video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 1;
    }

    #ar-container canvas {
      display: block;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2;
      background: transparent !important;
    }

    #labels-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .part-label {
      position: absolute;
      transform: translate(-50%, -50%);
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.88);
      border: 1.5px solid var(--tag-color, #38bdf8);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), 0 0 10px color-mix(in srgb, var(--tag-color, #38bdf8) 45%, transparent);
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.16s ease, opacity 0.16s ease, background 0.16s ease;
    }

    .part-label::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--tag-color, #38bdf8);
      margin-right: 6px;
      vertical-align: middle;
    }

    .part-label:hover {
      transform: translate(-50%, -50%) scale(1.07);
      background: rgba(30, 41, 59, 0.96);
    }

    .part-label.active {
      background: var(--tag-color, #38bdf8);
      color: #090d16;
      font-weight: 700;
    }

    .part-label.active::before {
      background: #090d16;
    }

    #top-controls {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .ui-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.88);
      color: var(--text-main);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .ui-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    #back-btn {
      display: none;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
    }

    #back-btn.visible {
      display: inline-flex;
    }

    #scan-status {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.45);
      font-size: 12px;
      font-weight: 600;
      color: #e0f2fe;
      backdrop-filter: blur(8px);
      max-width: 320px;
    }

    #description-wrapper {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      max-width: 340px;
      width: calc(100vw - 32px);
    }

    #show-desc-btn {
      display: none;
      margin-left: auto;
    }

    #description-wrapper.hidden-card #description-card {
      display: none;
    }

    #description-wrapper.hidden-card #show-desc-btn {
      display: inline-flex;
    }

    #description-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 14px;
      padding: 14px 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .swatch-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      flex-shrink: 0;
    }

    #part-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
    }

    #hide-desc-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    #hide-desc-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    #part-desc {
      font-size: 13px;
      line-height: 1.48;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .controls-hint {
      font-size: 11.5px;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
    }

    @media (max-width: 600px) {
      #description-wrapper {
        right: 12px;
        bottom: 12px;
        width: calc(100vw - 24px);
      }

      #scan-status {
        top: 60px;
        left: 16px;
        right: auto;
      }

      .part-label {
        font-size: 10.5px;
        padding: 3px 8px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <div id="ar-container"></div>
  <div id="labels-layer"></div>

  <div id="top-controls">
    <button id="back-btn" class="ui-btn" type="button">← Back to Full Board</button>
    <button id="reset-pose-btn" class="ui-btn" type="button">Reset Transform</button>
  </div>

  <div id="scan-status">Starting camera &amp; target...</div>

  <div id="description-wrapper">
    <button id="show-desc-btn" class="ui-btn" type="button">Show Info</button>
    <div id="description-card">
      <div class="card-header">
        <div class="card-title-group">
          <span id="swatch-dot" class="swatch-dot"></span>
          <h2 id="part-title">ATX Motherboard AR</h2>
        </div>
        <button id="hide-desc-btn" type="button">Hide</button>
      </div>
      <p id="part-desc">
        Scan your target image to display the 3D motherboard. Tap any labeled part to zoom in, drag to rotate, or pinch/scroll to zoom.
      </p>
      <div class="controls-hint">
        Drag: Rotate · Pinch/Scroll: Zoom · Tap Part: Focus &amp; Zoom
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    const container = document.getElementById('ar-container');
    const labelsLayer = document.getElementById('labels-layer');
    const backBtn = document.getElementById('back-btn');
    const resetPoseBtn = document.getElementById('reset-pose-btn');
    const scanStatusEl = document.getElementById('scan-status');
    const descWrapper = document.getElementById('description-wrapper');
    const hideDescBtn = document.getElementById('hide-desc-btn');
    const showDescBtn = document.getElementById('show-desc-btn');
    const partTitleEl = document.getElementById('part-title');
    const partDescEl = document.getElementById('part-desc');
    const swatchDotEl = document.getElementById('swatch-dot');

    if (!window.isSecureContext) {
      scanStatusEl.textContent = 'Camera requires HTTPS or localhost';
    }

    const mindarThree = new MindARThree({
      container,
      imageTargetSrc: './assets/targets (2).mind'
    });

    const { renderer, scene, camera } = mindarThree;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const hemiLight = new THREE.HemisphereLight(0xe0f2fe, 0x1e1b4b, 1.4);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(4, 8, 6);
    scene.add(keyLight);

    const rimLight1 = new THREE.DirectionalLight(0x22d3ee, 1.35);
    rimLight1.position.set(-6, 5, -4);
    scene.add(rimLight1);

    const rimLight2 = new THREE.DirectionalLight(0xf472b6, 1.15);
    rimLight2.position.set(6, 4, -5);
    scene.add(rimLight2);

    const anchor = mindarThree.addAnchor(0);

    const arRoot = new THREE.Group();
    const baseScale = 0.14;
    arRoot.scale.setScalar(baseScale);
    arRoot.position.set(0, 0, 0.08);
    anchor.group.add(arRoot);

    const motherboardGroup = new THREE.Group();
    arRoot.add(motherboardGroup);

    const interactiveParts = [];
    const pickableMeshes = [];
    const originalColors = new Map();
    let targetFound = false;

    function registerPart({
      id,
      name,
      color,
      description,
      group,
      anchorLocal,
      focusScaleMultiplier = 2.15
    }) {
      const meshes = [];
      group.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.userData.partId = id;
          pickableMeshes.push(child);
          meshes.push(child);
          if (child.material && child.material.color) {
            originalColors.set(child, child.material.color.clone());
          }
        }
      });

      const part = {
        id,
        name,
        color,
        description,
        group,
        meshes,
        anchorLocal: anchorLocal.clone(),
        focusScaleMultiplier,
        labelEl: null
      };

      const labelEl = document.createElement('button');
      labelEl.type = 'button';
      labelEl.className = 'part-label';
      labelEl.textContent = name;
      labelEl.style.setProperty('--tag-color', color);
      labelEl.style.opacity = '0';
      labelEl.style.pointerEvents = 'none';
      labelEl.addEventListener('click', (e) => {
        e.stopPropagation();
        focusOnPart(part);
      });
      labelsLayer.appendChild(labelEl);
      part.labelEl = labelEl;

      interactiveParts.push(part);
      motherboardGroup.add(group);
      return part;
    }

    function createPcbTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
      grad.addColorStop(0, '#072b28');
      grad.addColorStop(0.5, '#093833');
      grad.addColorStop(1, '#062226');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      ctx.strokeStyle = 'rgba(34, 211, 238, 0.22)';
      ctx.lineWidth = 2.5;
      for (let i = 60; i < 960; i += 36) {
        ctx.beginPath();
        ctx.moveTo(i, 40);
        ctx.lineTo(i, 360);
        ctx.lineTo(i + 48, 408);
        ctx.lineTo(i + 48, 960);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(250, 204, 21, 0.25)';
      ctx.lineWidth = 3;
      for (let j = 100; j < 920; j += 70) {
        ctx.beginPath();
        ctx.moveTo(60, j);
        ctx.lineTo(420, j);
        ctx.lineTo(470, j + 50);
        ctx.lineTo(960, j + 50);
        ctx.stroke();
      }

      for (let x = 80; x <= 944; x += 64) {
        for (let y = 80; y <= 944; y += 64) {
          ctx.fillStyle = 'rgba(251, 191, 36, 0.45)';
          ctx.beginPath();
          ctx.arc(x, y, 4.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#062226';
          ctx.beginPath();
          ctx.arc(x, y, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    const pcbMat = new THREE.MeshStandardMaterial({
      map: createPcbTexture(),
      roughness: 0.42,
      metalness: 0.25
    });
    const pcbMesh = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.16, 6.2), pcbMat);
    pcbMesh.receiveShadow = true;
    pcbMesh.castShadow = true;
    motherboardGroup.add(pcbMesh);

    const trimMat = new THREE.MeshStandardMaterial({
      color: 0x06b6d4,
      emissive: 0x0891b2,
      emissiveIntensity: 0.35,
      roughness: 0.3,
      metalness: 0.6
    });
    const frontTrim = new THREE.Mesh(new THREE.BoxGeometry(7.64, 0.05, 0.06), trimMat);
    frontTrim.position.set(0, 0, 3.11);
    motherboardGroup.add(frontTrim);

    const standoffMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.85, roughness: 0.25 });
    const standoffCoords = [
      [-3.5, 0.1, -2.8], [0, 0.1, -2.8], [3.5, 0.1, -2.8],
      [-3.5, 0.1, 0], [0, 0.1, 0], [3.5, 0.1, 0],
      [-3.5, 0.1, 2.8], [0, 0.1, 2.8], [3.5, 0.1, 2.8]
    ];
    standoffCoords.forEach(([x, y, z]) => {
      const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.04, 16), standoffMat);
      ring.position.set(x, y, z);
      motherboardGroup.add(ring);
    });

    const cpuGroup = new THREE.Group();
    cpuGroup.position.set(-0.6, 0.08, -1.05);
    const socketBase = new THREE.Mesh(
      new THREE.BoxGeometry(1.55, 0.14, 1.55),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.45, metalness: 0.3 })
    );
    socketBase.position.y = 0.07;
    const cpuIhs = new THREE.Mesh(
      new THREE.BoxGeometry(1.18, 0.09, 1.18),
      new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.88, roughness: 0.2 })
    );
    cpuIhs.position.y = 0.17;
    const cpuAccent = new THREE.Mesh(
      new THREE.BoxGeometry(1.62, 0.06, 0.14),
      new THREE.MeshStandardMaterial({ color: 0xf97316, emissive: 0xea580c, emissiveIntensity: 0.35, roughness: 0.35 })
    );
    cpuAccent.position.set(0, 0.11, 0.76);
    cpuGroup.add(socketBase, cpuIhs, cpuAccent);
    registerPart({
      id: 'cpu',
      name: 'CPU Socket',
      color: '#fb923c',
      description: 'Houses the processor and delivers high-speed data and power lanes to memory, expansion slots, and storage.',
      group: cpuGroup,
      anchorLocal: new THREE.Vector3(-0.6, 0.35, -1.05),
      focusScaleMultiplier: 2.25
    });

    const vrmGroup = new THREE.Group();
    const vrmCyanMat = new THREE.MeshStandardMaterial({
      color: 0x06b6d4,
      metalness: 0.78,
      roughness: 0.24
    });
    const vrmMagentaMat = new THREE.MeshStandardMaterial({
      color: 0xec4899,
      metalness: 0.72,
      roughness: 0.28
    });
    const topHeatsink = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.62, 0.75), vrmCyanMat);
    topHeatsink.position.set(-0.6, 0.39, -2.35);
    const leftHeatsink = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.62, 2.1), vrmMagentaMat);
    leftHeatsink.position.set(-2.15, 0.39, -1.05);

    for (let i = -4; i <= 4; i++) {
      const fin = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.78), vrmCyanMat);
      fin.position.set(-0.6 + i * 0.25, 0.75, -2.35);
      vrmGroup.add(fin);
    }
    vrmGroup.add(topHeatsink, leftHeatsink);
    registerPart({
      id: 'vrm',
      name: 'VRM Heatsinks',
      color: '#22d3ee',
      description: 'Voltage Regulator Module heatsinks dissipate heat from power stages so the CPU stays stable under heavy loads.',
      group: vrmGroup,
      anchorLocal: new THREE.Vector3(-1.3, 0.85, -1.8),
      focusScaleMultiplier: 2.0
    });

    const ramGroup = new THREE.Group();
    ramGroup.position.set(1.55, 0.08, -1.05);
    const ramColors = [0x84cc16, 0x1e293b, 0x84cc16, 0x1e293b];
    const clipColors = [0xa3e635, 0xf43f5e, 0xa3e635, 0xf43f5e];
    ramColors.forEach((col, idx) => {
      const xOff = (idx - 1.5) * 0.32;
      const slot = new THREE.Mesh(
        new THREE.BoxGeometry(0.16, 0.22, 2.55),
        new THREE.MeshStandardMaterial({ color: col, roughness: 0.35, metalness: 0.2 })
      );
      slot.position.set(xOff, 0.11, 0);
      ramGroup.add(slot);

      const clip = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.26, 0.14),
        new THREE.MeshStandardMaterial({ color: clipColors[idx], roughness: 0.3, metalness: 0.25 })
      );
      clip.position.set(xOff, 0.13, 1.32);
      ramGroup.add(clip);
    });
    registerPart({
      id: 'ram',
      name: 'RAM Slots',
      color: '#a3e635',
      description: 'Four DDR memory slots providing ultra-fast temporary workspace for active applications and operating system data.',
      group: ramGroup,
      anchorLocal: new THREE.Vector3(1.55, 0.35, -1.05),
      focusScaleMultiplier: 2.1
    });

    const pcieGroup = new THREE.Group();
    pcieGroup.position.set(-0.75, 0.08, 0.45);
    const pcieHousing = new THREE.Mesh(
      new THREE.BoxGeometry(3.4, 0.24, 0.34),
      new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.32, metalness: 0.45 })
    );
    pcieHousing.position.y = 0.12;
    const pcieMetalShield = new THREE.Mesh(
      new THREE.BoxGeometry(3.44, 0.1, 0.38),
      new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.88, roughness: 0.2 })
    );
    pcieMetalShield.position.y = 0.2;
    const pcieLatch = new THREE.Mesh(
      new THREE.BoxGeometry(0.22, 0.3, 0.42),
      new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xd97706, emissiveIntensity: 0.35, roughness: 0.3 })
    );
    pcieLatch.position.set(1.75, 0.15, 0);
    pcieGroup.add(pcieHousing, pcieMetalShield, pcieLatch);
    registerPart({
      id: 'pcie',
      name: 'PCIe x16 Slot',
      color: '#60a5fa',
      description: 'High-bandwidth expansion slot primarily used for graphics cards (GPUs) with reinforced metal shielding.',
      group: pcieGroup,
      anchorLocal: new THREE.Vector3(-0.75, 0.35, 0.45),
      focusScaleMultiplier: 2.1
    });

    const m2Group = new THREE.Group();
    m2Group.position.set(-0.75, 0.08, 1.35);
    const m2Base = new THREE.Mesh(
      new THREE.BoxGeometry(2.6, 0.08, 0.52),
      new THREE.MeshStandardMaterial({ color: 0x312e81, roughness: 0.4, metalness: 0.35 })
    );
    m2Base.position.y = 0.04;
    const m2Shield = new THREE.Mesh(
      new THREE.BoxGeometry(2.4, 0.16, 0.44),
      new THREE.MeshStandardMaterial({ color: 0xa855f7, metalness: 0.72, roughness: 0.25 })
    );
    m2Shield.position.set(-0.08, 0.14, 0);
    m2Group.add(m2Base, m2Shield);
    registerPart({
      id: 'm2',
      name: 'M.2 SSD Slot',
      color: '#c084fc',
      description: 'Compact high-speed storage interface for NVMe M.2 solid-state drives directly over PCIe lanes.',
      group: m2Group,
      anchorLocal: new THREE.Vector3(-0.75, 0.28, 1.35),
      focusScaleMultiplier: 2.2
    });

    const chipsetGroup = new THREE.Group();
    chipsetGroup.position.set(1.85, 0.08, 1.55);
    const chipsetBody = new THREE.Mesh(
      new THREE.BoxGeometry(1.55, 0.34, 1.55),
      new THREE.MeshStandardMaterial({ color: 0xe11d48, metalness: 0.75, roughness: 0.25 })
    );
    chipsetBody.position.y = 0.17;
    const chipsetBadge = new THREE.Mesh(
      new THREE.BoxGeometry(0.95, 0.05, 0.55),
      new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.85, roughness: 0.2 })
    );
    chipsetBadge.position.set(0, 0.36, 0);
    chipsetGroup.add(chipsetBody, chipsetBadge);
    registerPart({
      id: 'chipset',
      name: 'Chipset',
      color: '#fb7185',
      description: 'Coordinates I/O traffic between storage drives, USB controllers, networking, and secondary expansion slots.',
      group: chipsetGroup,
      anchorLocal: new THREE.Vector3(1.85, 0.45, 1.55),
      focusScaleMultiplier: 2.25
    });

    const atxPowerGroup = new THREE.Group();
    atxPowerGroup.position.set(3.45, 0.08, -1.1);
    const atxBlock = new THREE.Mesh(
      new THREE.BoxGeometry(0.45, 0.42, 1.45),
      new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.32, metalness: 0.25 })
    );
    atxBlock.position.y = 0.21;
    atxPowerGroup.add(atxBlock);
    registerPart({
      id: 'atx24',
      name: '24-Pin Power',
      color: '#facc15',
      description: 'Main power supply socket delivering 12V, 5V, and 3.3V rails from the PSU to the motherboard.',
      group: atxPowerGroup,
      anchorLocal: new THREE.Vector3(3.45, 0.4, -1.1),
      focusScaleMultiplier: 2.3
    });

    const sataGroup = new THREE.Group();
    sataGroup.position.set(3.45, 0.08, 0.95);
    const sataColors = [0x06b6d4, 0x10b981, 0x06b6d4, 0x10b981];
    sataColors.forEach((col, i) => {
      const port = new THREE.Mesh(
        new THREE.BoxGeometry(0.36, 0.24, 0.26),
        new THREE.MeshStandardMaterial({ color: col, roughness: 0.3, metalness: 0.25 })
      );
      port.position.set(0, 0.12, (i - 1.5) * 0.34);
      sataGroup.add(port);
    });
    registerPart({
      id: 'sata',
      name: 'SATA Ports',
      color: '#34d399',
      description: 'Serial ATA storage connectors for 2.5-inch SSDs, mechanical hard drives, and optical drives.',
      group: sataGroup,
      anchorLocal: new THREE.Vector3(3.45, 0.3, 0.95),
      focusScaleMultiplier: 2.3
    });

    const cmosGroup = new THREE.Group();
    cmosGroup.position.set(0.65, 0.08, 2.35);
    const cmosHolder = new THREE.Mesh(
      new THREE.CylinderGeometry(0.46, 0.48, 0.12, 24),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 })
    );
    cmosHolder.position.y = 0.06;
    const cmosCell = new THREE.Mesh(
      new THREE.CylinderGeometry(0.4, 0.4, 0.1, 24),
      new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.92, roughness: 0.18 })
    );
    cmosCell.position.y = 0.12;
    cmosGroup.add(cmosHolder, cmosCell);
    registerPart({
      id: 'cmos',
      name: 'CMOS Battery',
      color: '#e2e8f0',
      description: 'CR2032 coin cell that powers BIOS/UEFI firmware settings and the real-time system clock when unplugged.',
      group: cmosGroup,
      anchorLocal: new THREE.Vector3(0.65, 0.28, 2.35),
      focusScaleMultiplier: 2.4
    });

    const ioGroup = new THREE.Group();
    ioGroup.position.set(-3.55, 0.08, 0.25);

    const ioShroud = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.72, 4.6),
      new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.65, roughness: 0.32 })
    );
    ioShroud.position.set(0, 0.36, 0);
    ioGroup.add(ioShroud);

    const portDefs = [
      { z: -1.75, h: 0.34, d: 0.42, color: 0x38bdf8 },
      { z: -1.2,  h: 0.34, d: 0.42, color: 0x38bdf8 },
      { z: -0.6,  h: 0.26, d: 0.46, color: 0xa855f7 },
      { z: -0.1,  h: 0.26, d: 0.46, color: 0x22c55e },
      { z: 0.55,  h: 0.44, d: 0.52, color: 0xf59e0b },
      { z: 1.25,  h: 0.24, d: 0.24, color: 0x4ade80 },
      { z: 1.6,   h: 0.24, d: 0.24, color: 0xf472b6 },
      { z: 1.95,  h: 0.24, d: 0.24, color: 0x60a5fa }
    ];

    portDefs.forEach((p) => {
      const portMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.62, p.h, p.d),
        new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.32, metalness: 0.35 })
      );
      portMesh.position.set(-0.02, 0.36, p.z);
      ioGroup.add(portMesh);
    });

    registerPart({
      id: 'rear_io',
      name: 'Rear I/O Ports',
      color: '#38bdf8',
      description: 'External ports including USB, HDMI/DisplayPort video outputs, Gigabit/2.5G Ethernet LAN, and color-coded audio jacks.',
      group: ioGroup,
      anchorLocal: new THREE.Vector3(-3.6, 0.45, 0.25),
      focusScaleMultiplier: 2.1
    });

    let activePart = null;
    let userScaleMultiplier = 1.0;
    let desiredScaleMultiplier = 1.0;
    const desiredBoardPos = new THREE.Vector3(0, 0, 0);

    function highlightPart(part) {
      interactiveParts.forEach((p) => {
        const isSelected = part && p.id === part.id;
        p.labelEl.classList.toggle('active', isSelected);
        p.meshes.forEach((m) => {
          const base = originalColors.get(m);
          if (!base || !m.material) return;
          if (isSelected) {
            m.material.emissive.set(p.color);
            m.material.emissiveIntensity = 0.35;
          } else {
            m.material.emissive.setHex(0x000000);
            m.material.emissiveIntensity = 0;
          }
        });
      });
    }

    function focusOnPart(part) {
      activePart = part;
      highlightPart(part);

      desiredScaleMultiplier = userScaleMultiplier * part.focusScaleMultiplier;
      desiredBoardPos.copy(part.anchorLocal).multiplyScalar(-1);

      backBtn.classList.add('visible');
      partTitleEl.textContent = part.name;
      partDescEl.textContent = part.description;
      swatchDotEl.style.background = part.color;
      swatchDotEl.style.boxShadow = `0 0 12px ${part.color}`;
      descWrapper.classList.remove('hidden-card');
    }

    function resetView() {
      activePart = null;
      highlightPart(null);

      desiredScaleMultiplier = userScaleMultiplier;
      desiredBoardPos.set(0, 0, 0);

      backBtn.classList.remove('visible');
      partTitleEl.textContent = 'ATX Motherboard AR';
      partDescEl.textContent = 'Scan your target image to display the 3D motherboard. Tap any labeled part to zoom in, drag to rotate, or pinch/scroll to zoom.';
      swatchDotEl.style.background = '#38bdf8';
      swatchDotEl.style.boxShadow = '0 0 12px #38bdf8';
    }

    function resetTransform() {
      userScaleMultiplier = 1.0;
      motherboardGroup.rotation.set(0, 0, 0);
      resetView();
    }

    backBtn.addEventListener('click', resetView);
    resetPoseBtn.addEventListener('click', resetTransform);
    hideDescBtn.addEventListener('click', () => descWrapper.classList.add('hidden-card'));
    showDescBtn.addEventListener('click', () => descWrapper.classList.remove('hidden-card'));

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let isDragging = false;
    let prevPointer = { x: 0, y: 0 };
    let downPointer = { x: 0, y: 0 };
    let totalDragDist = 0;
    let pinchStartDist = null;

    function getTouchDist(t1, t2) {
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'touch') return;
      isDragging = true;
      prevPointer = { x: e.clientX, y: e.clientY };
      downPointer = { x: e.clientX, y: e.clientY };
      totalDragDist = 0;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || e.pointerType === 'touch') return;
      const dx = e.clientX - prevPointer.x;
      const dy = e.clientY - prevPointer.y;
      totalDragDist += Math.hypot(dx, dy);
      motherboardGroup.rotation.y += dx * 0.01;
      motherboardGroup.rotation.x += dy * 0.01;
      prevPointer = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', (e) => {
      if (e.pointerType === 'touch') return;
      if (isDragging && totalDragDist < 6) {
        pickPartAt(e.clientX, e.clientY);
      }
      isDragging = false;
    });

    renderer.domElement.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        pinchStartDist = null;
        prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        downPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        totalDragDist = 0;
      } else if (e.touches.length === 2) {
        isDragging = false;
        pinchStartDist = getTouchDist(e.touches[0], e.touches[1]);
      }
    }, { passive: true });

    renderer.domElement.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        const dx = e.touches[0].clientX - prevPointer.x;
        const dy = e.touches[0].clientY - prevPointer.y;
        totalDragDist += Math.hypot(dx, dy);
        motherboardGroup.rotation.y += dx * 0.012;
        motherboardGroup.rotation.x += dy * 0.012;
        prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2 && pinchStartDist) {
        const dist = getTouchDist(e.touches[0], e.touches[1]);
        const ratio = dist / pinchStartDist;
        userScaleMultiplier = Math.max(0.45, Math.min(2.6, userScaleMultiplier * ratio));
        desiredScaleMultiplier = activePart
          ? userScaleMultiplier * activePart.focusScaleMultiplier
          : userScaleMultiplier;
        pinchStartDist = dist;
      }
    }, { passive: true });

    renderer.domElement.addEventListener('touchend', (e) => {
      if (e.touches.length === 0 && isDragging && totalDragDist < 8) {
        pickPartAt(downPointer.x, downPointer.y);
      }
      if (e.touches.length < 2) {
        pinchStartDist = null;
      }
      if (e.touches.length === 0) {
        isDragging = false;
      }
    });

    renderer.domElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.08 : 0.92;
      userScaleMultiplier = Math.max(0.45, Math.min(2.6, userScaleMultiplier * factor));
      desiredScaleMultiplier = activePart
        ? userScaleMultiplier * activePart.focusScaleMultiplier
        : userScaleMultiplier;
    }, { passive: false });

    function pickPartAt(clientX, clientY) {
      if (!targetFound) return;
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(pickableMeshes, false);
      if (hits.length > 0) {
        const clickedId = hits[0].object.userData.partId;
        const found = interactiveParts.find((p) => p.id === clickedId);
        if (found) {
          focusOnPart(found);
        }
      }
    }

    anchor.onTargetFound = () => {
      targetFound = true;
      scanStatusEl.textContent = 'Target locked — Tap any part';
    };

    anchor.onTargetLost = () => {
      targetFound = false;
      scanStatusEl.textContent = 'Point camera at target image';
      interactiveParts.forEach((p) => {
        p.labelEl.style.opacity = '0';
        p.labelEl.style.pointerEvents = 'none';
      });
    };

    function updateLabels() {
      if (!targetFound) return;

      const width = window.innerWidth;
      const height = window.innerHeight;
      const placedRects = [];

      const projected = interactiveParts.map((part) => {
        const worldPos = part.anchorLocal.clone();
        motherboardGroup.localToWorld(worldPos);

        const ndc = worldPos.clone().project(camera);
        const visible = ndc.z < 1 && ndc.z > -1;
        const x = (ndc.x * 0.5 + 0.5) * width;
        const y = (-ndc.y * 0.5 + 0.5) * height - 16;

        return { part, visible, x, y };
      });

      projected.sort((a, b) => {
        if (activePart && a.part.id === activePart.id) return -1;
        if (activePart && b.part.id === activePart.id) return 1;
        return a.y - b.y;
      });

      const padX = 8;
      const padY = 6;

      projected.forEach(({ part, visible, x, y }) => {
        const el = part.labelEl;
        if (!visible) {
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
          return;
        }

        el.style.opacity = '1';
        el.style.pointerEvents = 'auto';

        const rect = el.getBoundingClientRect();
        const w = rect.width || 100;
        const h = rect.height || 26;

        let clampedX = Math.max(w / 2 + 10, Math.min(width - w / 2 - 10, x));
        let clampedY = Math.max(h / 2 + 10, Math.min(height - h / 2 - 10, y));

        let guard = 0;
        while (guard < 25) {
          const box = {
            left: clampedX - w / 2 - padX,
            right: clampedX + w / 2 + padX,
            top: clampedY - h / 2 - padY,
            bottom: clampedY + h / 2 + padY
          };

          const hit = placedRects.find(
            (r) =>
              box.left < r.right &&
              box.right > r.left &&
              box.top < r.bottom &&
              box.bottom > r.top
          );

          if (!hit) break;

          if (hit.bottom + h / 2 + padY < height - 14) {
            clampedY = hit.bottom + h / 2 + padY;
          } else if (hit.top - h / 2 - padY > 14) {
            clampedY = hit.top - h / 2 - padY;
          } else {
            clampedX = Math.min(width - w / 2 - 12, hit.right + w / 2 + padX);
          }
          guard++;
        }

        placedRects.push({
          left: clampedX - w / 2 - padX,
          right: clampedX + w / 2 + padX,
          top: clampedY - h / 2 - padY,
          bottom: clampedY + h / 2 + padY
        });

        el.style.left = `${clampedX}px`;
        el.style.top = `${clampedY}px`;
      });
    }

    async function startAR() {
      try {
        await mindarThree.start();
        scanStatusEl.textContent = 'Point camera at target image';

        renderer.setAnimationLoop(() => {
          const currentMult = arRoot.scale.x / baseScale;
          const nextMult = THREE.MathUtils.lerp(currentMult, desiredScaleMultiplier, 0.1);
          arRoot.scale.setScalar(baseScale * nextMult);
          motherboardGroup.position.lerp(desiredBoardPos, 0.1);

          renderer.render(scene, camera);
          updateLabels();
        });
      } catch (err) {
        const msg = err && err.message ? err.message : 'Camera failed to start';
        scanStatusEl.textContent = `Error: ${msg}`;
        console.error('MindAR start error:', err);
      }
    }

    startAR();
  </script>
</body>
